subprojects {
    configurations.all {
        resolutionStrategy.force 'com.liferay:com.liferay.portal.vulcan.api:9.3.1'
    }

    tasks.withType(JavaCompile).configureEach {
        javaCompiler = javaToolchains.compilerFor {
            languageVersion = JavaLanguageVersion.of(8)
        }
    }
}
